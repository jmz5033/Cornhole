<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cornhole">
  <meta name="theme-color" content="#111111">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Cornhole Scorekeeper</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/nosleep.js/dist/NoSleep.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'Fredoka', sans-serif; background: #111; color: #fff; }

@keyframes bounceIn {
  0% { transform: scale(0.3); opacity: 0; }
  50% { transform: scale(1.1); }
  70% { transform: scale(0.9); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes scorePop {
  0% { transform: scale(1); }
  30% { transform: scale(1.12); }
  100% { transform: scale(1); }
}
@keyframes confettiUp {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(-140px) rotate(720deg); opacity: 0; }
}
@keyframes flash {
  0% { opacity: 0.15; }
  100% { opacity: 0; }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
}

.panels {
  display: flex;
  flex: 1;
  min-height: 0;
}

.panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  position: relative;
  overflow: hidden;
  transition: filter 0.1s, opacity 0.2s;
  touch-action: manipulation;
}
.panel:active { filter: brightness(1.1); }
.panel--inactive {
  opacity: 0.5;
  cursor: default;
}
.panel--active-turn::after {
  content: '';
  position: absolute;
  inset: 0;
  border: 4px solid rgba(255,255,255,0.45);
  pointer-events: none;
  z-index: 3;
}

.panel__flash {
  position: absolute; inset: 0;
  background: rgba(255,255,255,0.15);
  pointer-events: none;
  animation: flash 0.25s ease-out forwards;
}

.sudden-death-badge {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(220, 38, 38, 0.85);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  padding: 4px 12px;
  border-radius: 20px;
  white-space: nowrap;
  z-index: 5;
}

.team-name {
  font-size: 16px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 3px;
  color: rgba(255,255,255,0.7);
  margin-bottom: 8px;
  position: relative;
  z-index: 2;
}
.team-name-input {
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 8px;
  color: #fff;
  text-align: center;
  font-size: 16px;
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  padding: 6px 12px;
  width: 80%;
  max-width: 180px;
  outline: none;
  position: relative;
  z-index: 5;
}

.score {
  font-family: 'Lilita One', sans-serif;
  font-size: min(36vw, 200px);
  line-height: 1;
  color: #fff;
  text-shadow: 0 6px 24px rgba(0,0,0,0.4);
  position: relative;
  z-index: 2;
}
.score--pop { animation: scorePop 0.25s ease-out; }

/* Smaller scores for 3-panel cutthroat layout */
.panels--triple .score { font-size: min(22vw, 160px); }
.panels--triple .team-name { font-size: 13px; letter-spacing: 2px; }

.tap-hint {
  margin-top: 16px;
  font-size: 12px;
  color: rgba(255,255,255,0.35);
  letter-spacing: 1px;
  position: relative;
  z-index: 2;
}

.controls {
  background: rgba(0,0,0,0.6);
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  display: flex;
  gap: 8px;
  justify-content: center;
  align-items: center;
  position: relative;
}

.btn {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  color: rgba(255,255,255,0.5);
  padding: 10px 16px;
  font-size: 14px;
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  outline: none;
  touch-action: manipulation;
}
.btn:active { transform: scale(0.95); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn--end-turn {
  background: rgba(255,255,255,0.18);
  border-color: rgba(255,255,255,0.35);
  color: #fff;
}

.label {
  font-size: 12px;
  color: rgba(255,255,255,0.25);
  padding: 0 8px;
}

/* Mode dropup */
.mode-dropup-wrap { position: relative; }
.mode-dropup {
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  background: #1e1e1e;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 14px;
  overflow: hidden;
  min-width: 140px;
  box-shadow: 0 -4px 24px rgba(0,0,0,0.6);
  animation: slideUp 0.18s ease;
  z-index: 50;
}
.mode-option {
  display: block;
  width: 100%;
  padding: 12px 20px;
  text-align: left;
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  font-size: 15px;
  color: rgba(255,255,255,0.5);
  background: none;
  border: none;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  cursor: pointer;
  outline: none;
  touch-action: manipulation;
}
.mode-option:last-child { border-bottom: none; }
.mode-option:active { background: rgba(255,255,255,0.08); }
.mode-option--active { color: #fff; }

/* Color picker overlay */
.color-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  animation: fadeIn 0.2s ease;
}
.color-picker {
  background: #1e1e1e;
  border-radius: 20px;
  padding: 28px;
  width: 300px;
  max-width: 90vw;
  animation: slideUp 0.3s ease;
}
.color-picker h3 {
  font-family: 'Lilita One', sans-serif;
  font-size: 20px;
  margin-bottom: 20px;
  text-align: center;
  color: rgba(255,255,255,0.9);
}
.color-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
.color-swatch {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 14px;
  border: 3px solid transparent;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s;
  outline: none;
}
.color-swatch:active { transform: scale(0.9); }
.color-swatch.selected { border-color: #fff; transform: scale(1.08); }
.color-cancel {
  width: 100%;
  padding: 12px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  color: rgba(255,255,255,0.6);
  font-size: 15px;
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  cursor: pointer;
  outline: none;
}
.color-cancel:active { transform: scale(0.97); }

/* Winner overlay */
.winner-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.8);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  animation: bounceIn 0.5s ease;
}
.winner-content { text-align: center; padding: 40px; position: relative; }
.winner-emoji { font-size: 56px; margin-bottom: 16px; }
.winner-name {
  font-family: 'Lilita One', sans-serif;
  font-size: 42px;
  text-shadow: 0 4px 16px rgba(0,0,0,0.4);
  margin-bottom: 8px;
}
.winner-sub {
  font-size: 20px;
  color: rgba(255,255,255,0.6);
  font-weight: 500;
  margin-bottom: 36px;
}
.winner-btn {
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 16px;
  color: #fff;
  padding: 16px 40px;
  font-size: 18px;
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  cursor: pointer;
  outline: none;
}
.winner-btn:active { transform: scale(0.95); }

.confetti-piece { position: absolute; }

  </style>
</head>
<body>

<div class="app" id="app"></div>

<script>
  const COLOR_OPTIONS = [
    { name: 'Yellow',  color: '#c89200', accent: '#f5bf00' },
    { name: 'Blue',    color: '#1a4b8c', accent: '#3b7ddd' },
    { name: 'Red',     color: '#a82020', accent: '#e03e3e' },
    { name: 'Green',   color: '#1e7a3a', accent: '#40c463' },
    { name: 'Purple',  color: '#6b2fa0', accent: '#9b59b6' },
    { name: 'Orange',  color: '#c65d07', accent: '#f08c00' },
    { name: 'Teal',    color: '#0e7c7b', accent: '#20c9b0' },
    { name: 'Pink',    color: '#b5357a', accent: '#e64ca1' },
  ];

  // gameMode: 'og' | 'cutthroat' | 'holes'
  const state = {
    gameMode: 'og',
    teams: [
      { name: 'Team 1', score: 0, colorIndex: 1 },
      { name: 'Team 2', score: 0, colorIndex: 0 },
    ],
    history: [],
    winner: null,
    editingName: null,
    flashing: null,
    popTeam: null,
    colorPicker: null,
    modePicker: false,
    holesTurn: 0,      // holes mode: which player is currently throwing (0 or 1)
    suddenDeath: false, // holes mode: whether we're in sudden death
  };

  function getColor(teamIndex) {
    return COLOR_OPTIONS[state.teams[teamIndex].colorIndex];
  }

  function getWinningScore() {
    return state.gameMode === 'holes' ? 10 : 21;
  }

  function render() {
    const app = document.getElementById('app');
    const t = state.teams;
    const w = state.winner;
    const isHoles = state.gameMode === 'holes';
    const isCutthroat = state.gameMode === 'cutthroat';

    const tripleClass = isCutthroat ? ' panels--triple' : '';
    let html = `<div class="panels${tripleClass}">`;

    for (let i = 0; i < t.length; i++) {
      const c = getColor(i);
      const divider = i < t.length - 1 ? 'border-right:3px solid rgba(0,0,0,0.4);' : '';
      const isActiveThrower = isHoles && state.holesTurn === i;
      const isInactive = isHoles && state.holesTurn !== i;
      const activeClass = isActiveThrower ? ' panel--active-turn' : '';
      const inactiveClass = isInactive ? ' panel--inactive' : '';

      html += `<div class="panel${activeClass}${inactiveClass}" style="background:linear-gradient(170deg,${c.color}ee,${c.color}bb);${divider}" onclick="addPoint(${i})">`;

      if (state.flashing === i) {
        html += `<div class="panel__flash"></div>`;
      }

      if (state.suddenDeath && w === null) {
        html += `<div class="sudden-death-badge">SUDDEN DEATH</div>`;
      }

      if (state.editingName === i) {
        html += `<input class="team-name-input" id="name-input-${i}" value="${t[i].name}"
          onclick="event.stopPropagation()"
          onblur="saveName(${i})"
          onkeydown="if(event.key==='Enter')saveName(${i})" autofocus>`;
      } else {
        html += `<div style="display:flex;align-items:center;gap:8px;position:relative;z-index:5">
          <div class="team-name" onclick="event.stopPropagation(); editName(${i})">${t[i].name}</div>
          <div onclick="event.stopPropagation(); openColorPicker(${i})" style="width:20px;height:20px;border-radius:50%;background:${c.accent};border:2px solid rgba(255,255,255,0.5);cursor:pointer;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,0.3);"></div>
        </div>`;
      }

      const popClass = state.popTeam === i ? ' score--pop' : '';
      html += `<div class="score${popClass}">${t[i].score}</div>`;

      if (w === null) {
        let hint = '';
        if (isHoles) {
          hint = isActiveThrower ? 'TAP FOR EACH HOLE' : '';
        } else {
          hint = 'TAP TO SCORE';
        }
        if (hint) html += `<div class="tap-hint">${hint}</div>`;
      }

      html += `</div>`;
    }

    html += `</div>`;

    // Controls
    const winScore = getWinningScore();
    const modeLabel = state.gameMode === 'holes' ? `First to ${winScore} holes` : `First to ${winScore}`;
    const modeNames = { og: 'OG', cutthroat: 'Cutthroat', holes: 'Holes' };

    const endTurnBtn = (isHoles && w === null) ? `
      <button class="btn btn--end-turn" onclick="endTurn()">End Turn</button>` : '';

    const dropup = state.modePicker ? `
      <div class="mode-dropup">
        <button class="mode-option${state.gameMode==='og'?' mode-option--active':''}" onclick="switchMode('og')">OG</button>
        <button class="mode-option${state.gameMode==='cutthroat'?' mode-option--active':''}" onclick="switchMode('cutthroat')">Cutthroat</button>
        <button class="mode-option${state.gameMode==='holes'?' mode-option--active':''}" onclick="switchMode('holes')">Holes</button>
      </div>` : '';

    html += `<div class="controls">
      <button class="btn" onclick="undo()" ${state.history.length === 0 ? 'disabled' : ''}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10h10a5 5 0 0 1 0 10H9"/>
          <polyline points="7 14 3 10 7 6"/>
        </svg>
        Undo
      </button>
      ${endTurnBtn}
      <div class="mode-dropup-wrap">
        <button class="btn${state.modePicker?' btn--end-turn':''}" onclick="toggleModePicker()">
          ${modeNames[state.gameMode]}
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="${state.modePicker ? '18 15 12 9 6 15' : '6 9 12 15 18 9'}"/>
          </svg>
        </button>
        ${dropup}
      </div>
      <div class="label">${modeLabel}</div>
      <button class="btn" onclick="resetGame()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/>
        </svg>
        New Game
      </button>
    </div>`;

    // Color picker
    if (state.colorPicker !== null) {
      const ti = state.colorPicker;
      const currentIdx = t[ti].colorIndex;
      html += `<div class="color-overlay" onclick="closeColorPicker()">
        <div class="color-picker" onclick="event.stopPropagation()">
          <h3>${t[ti].name} Color</h3>
          <div class="color-grid">`;

      COLOR_OPTIONS.forEach((opt, idx) => {
        const sel = idx === currentIdx ? ' selected' : '';
        html += `<button class="color-swatch${sel}" style="background:linear-gradient(145deg,${opt.accent},${opt.color})" onclick="pickColor(${ti},${idx})" title="${opt.name}"></button>`;
      });

      html += `</div>
          <button class="color-cancel" onclick="closeColorPicker()">Done</button>
        </div>
      </div>`;
    }

    // Winner overlay
    if (w !== null) {
      const wc = getColor(w);
      const colors = [wc.accent, '#f59f00', '#51cf66', '#ff6b6b', '#748ffc'];
      let confetti = '';
      for (let i = 0; i < 14; i++) {
        const left = 10 + Math.random() * 80;
        const size = 6 + Math.random() * 6;
        const br = i % 2 === 0 ? '50%' : '2px';
        const dur = 1 + Math.random();
        const delay = Math.random() * 0.5;
        confetti += `<div class="confetti-piece" style="left:${left}%;top:45%;width:${size}px;height:${size}px;border-radius:${br};background:${colors[i % 5]};animation:confettiUp ${dur}s ease-out ${delay}s both"></div>`;
      }

      html += `<div class="winner-overlay">
        <div class="winner-content">
          ${confetti}
          <div class="winner-emoji">🏆</div>
          <div class="winner-name" style="color:${wc.accent}">${t[w].name}</div>
          <div class="winner-sub">wins the game!</div>
          <button class="winner-btn" style="background:linear-gradient(145deg,${wc.accent},${wc.color});box-shadow:0 6px 24px ${wc.color}66" onclick="resetGame()">Play Again</button>
        </div>
      </div>`;
    }

    app.innerHTML = html;
  }

  function toggleModePicker() {
    state.modePicker = !state.modePicker;
    render();
  }

  function addPoint(teamIndex) {
    if (state.winner !== null || state.colorPicker !== null) return;
    if (state.modePicker) { state.modePicker = false; render(); return; }
    // Holes mode: only the current thrower can score
    if (state.gameMode === 'holes' && teamIndex !== state.holesTurn) return;

    state.teams[teamIndex].score++;
    state.history.push({ teamIndex, prevScore: state.teams[teamIndex].score - 1 });
    state.flashing = teamIndex;
    state.popTeam = teamIndex;

    // OG and Cutthroat: check for win after every point
    if (state.gameMode !== 'holes') {
      if (state.teams[teamIndex].score >= getWinningScore()) {
        state.winner = teamIndex;
      }
    }

    render();
    setTimeout(() => {
      state.flashing = null;
      state.popTeam = null;
      render();
    }, 250);
  }

  // Holes mode: called when the current thrower finishes their 8 bags
  function endTurn() {
    if (state.winner !== null) return;
    const next = 1 - state.holesTurn;
    state.holesTurn = next;

    // After both players have thrown (full round complete), check win condition
    if (next === 0) {
      const s0 = state.teams[0].score;
      const s1 = state.teams[1].score;
      if (Math.max(s0, s1) >= 10) {
        if (s0 > s1)      state.winner = 0;
        else if (s1 > s0) state.winner = 1;
        else              state.suddenDeath = true; // tied — keep playing
      }
    }

    render();
  }

  function undo() {
    if (state.history.length === 0) return;
    const last = state.history.pop();
    state.teams[last.teamIndex].score = last.prevScore;
    state.winner = null;
    render();
  }

  function resetGame() {
    const prev = state.teams;
    const mode = state.gameMode;

    state.history = [];
    state.winner = null;
    state.colorPicker = null;
    state.modePicker = false;
    state.holesTurn = 0;
    state.suddenDeath = false;

    if (mode === 'cutthroat') {
      state.teams = [
        { name: prev[0]?.name || 'Player 1', score: 0, colorIndex: prev[0]?.colorIndex ?? 1 },
        { name: prev[1]?.name || 'Player 2', score: 0, colorIndex: prev[1]?.colorIndex ?? 0 },
        { name: prev[2]?.name || 'Player 3', score: 0, colorIndex: prev[2]?.colorIndex ?? 4 },
      ];
    } else {
      state.teams = [
        { name: prev[0]?.name || 'Team 1', score: 0, colorIndex: prev[0]?.colorIndex ?? 1 },
        { name: prev[1]?.name || 'Team 2', score: 0, colorIndex: prev[1]?.colorIndex ?? 0 },
      ];
    }

    render();
  }

  function switchMode(mode) {
    if (state.gameMode === mode) { state.modePicker = false; render(); return; }
    state.gameMode = mode;
    state.teams = []; // clear so resetGame initializes fresh defaults
    resetGame();
  }

  function editName(index) {
    state.editingName = index;
    render();
    const input = document.getElementById('name-input-' + index);
    if (input) { input.focus(); input.select(); }
  }

  function saveName(index) {
    const input = document.getElementById('name-input-' + index);
    if (input) {
      state.teams[index].name = input.value.trim() || ('Team ' + (index + 1));
    }
    state.editingName = null;
    render();
  }

  function openColorPicker(teamIndex) {
    state.colorPicker = teamIndex;
    render();
  }

  function closeColorPicker() {
    state.colorPicker = null;
    render();
  }

  function pickColor(teamIndex, colorIndex) {
    state.teams[teamIndex].colorIndex = colorIndex;
    render();
  }

  render();

  // NoSleep.js — keeps screen awake on iOS via a tested looping video
  const noSleep = new NoSleep();
  document.addEventListener('touchstart', () => noSleep.enable(), { once: true });
  document.addEventListener('click',      () => noSleep.enable(), { once: true });

  // Wake Lock API — native support on Chrome/Android and Safari 16.4+
  let wakeLock = null;
  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
    } catch (e) { /* denied or unavailable, silently ignore */ }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') requestWakeLock();
  });
  requestWakeLock();
</script>

</body>
</html>
